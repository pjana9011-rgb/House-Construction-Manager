name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android Project
        run: |
          mkdir extracted
          unzip -q *.zip -d extracted
          chmod +x $(find extracted -name gradlew -type f)

      - name: Build APK
        run: |
          cd "$(dirname "$(find extracted -name gradlew -type f | head -1)")"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: House-Construction-Manager-APK
          path: extracted/**/app/build/outputs/apk/debug/*.apk
